name: ixl-watchdog

on:
  schedule:
    - cron: "5 20,23,3 * * *"
  workflow_dispatch:
    inputs:
      recon:
        description: "Run recon mode"
        default: "0"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install chromium --with-deps
      - name: Run
        env:
          IXL_USER: ${{ secrets.IXL_USER }}
          IXL_PASS: ${{ secrets.IXL_PASS }}
          IXL_PROFILE: ${{ secrets.IXL_PROFILE }}
          IXL_PROFILE_PASS: ${{ secrets.IXL_PROFILE_PASS }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          PHONE_KID: ${{ secrets.PHONE_KID }}
          PHONE_PARENT: ${{ secrets.PHONE_PARENT }}
          ENFORCEMENT_ENABLED: "false"
          RECON: ${{ github.event.inputs.recon || '0' }}
        run: python main.py
      - name: Upload recon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon
          path: recon/
          if-no-files-found: ignore
      - name: Commit state
        run: |
          git config user.name "ixl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f state/ || true
          git diff --staged --quiet || git commit -m "state $(date -u +%F_%H%M)"
          git push || true
